[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildscan"
dynamic = ["version"]
description = "Subsea photogrammetry pipeline: ROV imagery to georeferenced 3D models via RealityScan 2.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Wild Technology", email = "jonathan@wildtechnology.org" }]
keywords = [
    "photogrammetry", "rov", "subsea", "realityscan",
    "georeferencing", "3d-reconstruction", "ocean-exploration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Floors are the versions the H2023/H2024/ON2026 deliverables were built on
# (the HONEYBADGER box, 2026-08-08). Keep this list and requirements.txt in
# step - requirements.txt is generated from it by hand and must not drift.
#
# NOTE on the Python floor: numpy>=2.5 and scipy>=1.18 are themselves
# `requires-python >=3.12`, so 3.12 is the real floor for the pinned set.
# The pipeline is developed and run on `py -3.13`.
dependencies = [
    "boto3>=1.40",           # publish_cesium.py - S3 upload leg of the ion REST flow
    "geopandas>=1.1",        # modules/image_batcher - zone geometry
    "inquirer>=3.4",         # main.py - interactive module chain prompts
    "matplotlib>=3.11",      # modules/image_batcher - batch plots
    "numpy>=2.5",
    "opencv-python>=5.0",    # extract_images / preprocess_images (CLAHE, WB)
    "pandas>=3.0",
    "Pillow>=12.3",          # geoall.py, georeference, timestamp_rename (EXIF/JPEG)
    "pyproj>=3.7",           # cesium_placement - EGM2008 geoid, CRS transforms
    "requests>=2.32",        # publish_cesium.py - ion REST
    "rich>=15.0",            # wildscan TUI
    "scikit-learn>=1.9",     # modules/image_batcher - clustering
    "scipy>=1.18",
    "seaborn>=0.13",
    "shapely>=2.1",
    "textual>=8.2",          # wildscan TUI
    "tqdm>=4.69",
    "utm>=0.8",              # geoall.py, georeference - UTM <-> WGS84
]

[project.optional-dependencies]
# Test suite. Windows-only path fixtures mean a subset fails off-Windows.
dev = ["pytest>=9.1"]
# The wildscan TUI alone, without the geo/imaging pipeline stack.
tui = ["textual>=8.2", "rich>=15.0"]
# Reference-only scripts under archive/ (colmap_processor.py polls host
# CPU/RAM through psutil). Not needed by the active pipeline.
archive = ["psutil>=7.0"]

[project.urls]
Homepage = "https://github.com/wild-technology/wildscan"
Source = "https://github.com/wild-technology/wildscan"
Issues = "https://github.com/wild-technology/wildscan/issues"

[project.scripts]
wildscan = "wildscan.app:main"

[tool.setuptools.dynamic]
version = { attr = "wildscan.__version__" }

# Flat layout with many top-level driver scripts - list packages explicitly
# so setuptools does not try (and fail) to auto-discover them.
[tool.setuptools]
packages = [
    "wildscan",
    "module_base",
    "modules",
    "modules.extract_images",
    "modules.georeference",
    "modules.image_batcher",
    "modules.preprocess_images",
    "modules.realityscan_interface",
]
include-package-data = true

[tool.setuptools.package-data]
"modules" = ["cameras.json"]
"modules.realityscan_interface" = [
    "RS_CLI/Scripts/*.bat",
    "RS_CLI/Metadata/*.xml",
    "RS_CLI/Errors/*.bat",
    "RS_CLI/Errors/*.vbs",
]

[tool.pytest.ini_options]
testpaths = ["testing"]
addopts = "-q"
