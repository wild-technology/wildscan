name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python ${{ matrix.python-version }} / Windows
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Upgrade environment installer
        run: python -m pip install --upgrade "pip>=26.2"
      - name: Install checkout
        run: python -m pip install -e ".[dev]" build
      - name: Check dependencies and entry points
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wildscan --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m wildscan --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline tests
        run: python -m pytest -ra --junitxml=test-results.xml
      # Proves only that the package metadata and distributions build. The
      # wheel is not a runnable install: the driver scripts at the
      # repository root are not in it, and the pipeline runs only from an
      # editable source checkout.
      - name: Build distributions
        run: python -m build
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-test-results-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
